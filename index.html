<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#275b47"><title>Family Road Trip Scorecard</title>
<style>
:root{--green:#275b47;--ink:#202c27;--muted:#637168;--line:#dce2db;--bg:#f6f5ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif}main{max-width:820px;margin:auto;padding:18px 14px 40px}.eyebrow{color:var(--green);font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(2rem,7vw,3rem);line-height:1.05;margin:8px 0}p{color:var(--muted)}.bar{height:6px;background:#e0e6df;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--green);width:0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:8px 0}.card,.results{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.qnum{font-size:.8rem;color:var(--green);font-weight:800;text-transform:uppercase}.card h2{font-size:clamp(1.25rem,4.5vw,1.6rem);line-height:1.2;margin:8px 0 16px}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.photo{border:2px solid transparent;border-radius:12px;overflow:hidden;background:#e9eee8;position:relative}.photo:has(input:checked){border-color:var(--green)}.photo img{display:block;width:100%;height:125px;object-fit:cover}.photo input{width:20px;height:20px;accent-color:var(--green);margin:8px 6px 0}.photo label{display:block;padding:4px 7px 9px;font-weight:700;font-size:.8rem;cursor:pointer}fieldset{border:0;padding:0;margin:18px 0 0}legend{font-weight:800;margin-bottom:8px}.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.scale label{border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 2px;cursor:pointer;font-weight:800;font-size:.9rem}.scale input{display:block;margin:0 auto 5px;width:18px;height:18px;accent-color:var(--green)}.scale label:has(input:checked){background:#eaf1ec;border-color:var(--green)}small{display:block;font-size:.61rem;color:var(--muted);font-weight:600}.dots{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:white}.dot.answered{background:#dfece2}.dot.current{outline:2px solid var(--green);outline-offset:2px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{min-height:48px;border:0;border-radius:12px;padding:12px;font-size:1rem;font-weight:800;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:#e4e9e2;color:var(--ink)}.hidden{display:none!important}.row{padding:10px 0;border-bottom:1px solid var(--line)}textarea{width:100%;min-height:190px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;font:14px/1.4 monospace}.note{font-size:.8rem}@media(max-width:500px){main{padding:12px}.card{padding:12px}.photo img{height:92px}.photo label{font-size:.72rem;padding:4px 5px 7px}.scale{gap:4px}.scale label{font-size:.8rem;padding:8px 1px}.scale small{font-size:.55rem}}
</style></head><body><main><div class="eyebrow">Family trip planner</div><h1>What sounds fun on our road trip?</h1><p>Tap the picture you like best for each question. Your choice will take you to the next question.</p><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="where">Question 1 of 7</span><span id="count">0 answered</span></div><nav class="dots" id="dots" aria-label="Go to question"></nav>
<section id="quiz"><article class="card"><div class="qnum" id="qnum"></div><h2 id="prompt"></h2><div class="photos" id="photos"></div></article><div class="controls"><button class="btn secondary" id="prev" type="button">← Back</button><button class="btn primary" id="next" type="button">Next →</button></div></section>
<section id="results" class="results hidden"><h2>Your answers</h2><p id="summary"></p><div id="rows"></div><label for="output"><b>Copy these results to the family chat</b></label><textarea id="output" readonly></textarea><div class="controls"><button class="btn primary" id="copy" type="button">Copy results</button><button class="btn secondary" id="edit" type="button">Change answers</button></div><p id="status" role="status"></p></section><p class="note">Pictures need internet access. If a picture does not load, you can still answer the question.</p></main>
<script>
(function(){const qs=[
['Nature','Would you like to see a big waterfall, a canyon, or a great mountain view?',[['Waterfall','photo-1432405972618-c60b0225b8f9'],['Mountains','photo-1464822759023-fed622ff2c3b'],['Canyon','photo-1474044159687-1ee9f3a51722']]],
['Caves','Would you like to explore a cave or see cool rock formations underground?',[['Explore a cave','photo-1518837695005-2083093ee35b'],['Rock formations','photo-1519681393784-d120267933ba']]],
['Scenic drives','Would you like to drive through forests or mountains and stop for views?',[['Mountain road','photo-1464822759023-fed622ff2c3b'],['Forest','photo-1448375240586-882707db888b'],['Open road','photo-1500534623283-312aade485b7']]],
['Adventure activities','Which outdoor adventure would you like to try?',[['Kayaking','photo-1544551763-46a013bb70d5'],['Mountain biking','photo- bikes-placeholder'],['Outdoor rock climbing','photo-1522163182402-834f871fd851'],['ATV riding','photo-1558981806-ec527fa84c39']]],
['Animals','Would you like to see wild animals, go to a zoo, or visit an aquarium?',[['Wildlife','photo-1549366021-9f761d450615'],['Aquarium','photo-1535591273668-578e31182c4f'],['Birds','photo-1444464666168-49d633b86797']]],
['Science and space','Would you like to see rockets, planets, or fun science exhibits?',[['Rocket launch','photo-1451187580459-43490279c0fa'],['Science museum','photo-1532094349884-543bc11b234d'],['Planets','photo-1446776811953-b23d57bd21aa']]],
['Games and activities','Would you like to play mini golf, go to an arcade, or ride go-karts?',[['Mini golf','photo-1593113598332-cd288d649433'],['Arcade','photo-1511512578047-dfb367046420'],['Go-karts','photo-1558618666-fcd25c85cd64']]]
];
const pics=Array(7).fill(null);let n=0;const $=id=>document.getElementById(id);const url=id=>'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w=600&h=380&q=75';
function progress(){let c=pics.filter(x=>x!==null).length;$('fill').style.width=c/7*100+'%';$('count').textContent=c+' answered';$('where').textContent='Question '+(n+1)+' of 7';}
function dots(){let d=$('dots');d.replaceChildren();qs.forEach((q,i)=>{let b=document.createElement('button');b.type='button';b.className='dot'+(pics[i]!==null?' answered':'')+(i===n?' current':'');b.textContent=i+1;b.setAttribute('aria-label','Question '+(i+1));b.onclick=()=>{n=i;render();};d.append(b);});}
function render(){let q=qs[n];$('qnum').textContent='Question '+(n+1)+' · '+q[0];$('prompt').textContent=q[1];let ph=$('photos');ph.replaceChildren();q[2].forEach((p,i)=>{let c=document.createElement('div');c.className='photo';let im=document.createElement('img');im.src=url(p[1]);im.alt=p[0];im.loading='lazy';im.onerror=()=>{im.hidden=true;};let inp=document.createElement('input');inp.type='radio';inp.name='pic';inp.id='p'+n+'-'+i;inp.checked=pics[n]===i;inp.setAttribute('aria-label',p[0]);inp.onchange=()=>{pics[n]=i;advance();};let lab=document.createElement('label');lab.htmlFor=inp.id;lab.textContent=p[0];c.append(im,inp,lab);ph.append(c);});$('prev').disabled=n===0;$('prev').style.opacity=n===0?'.45':'1';$('next').textContent=n===6?'See results →':'Skip / Next →';$('quiz').classList.remove('hidden');$('results').classList.add('hidden');progress();dots();}
function advance(){progress();dots();if(n<6){n++;render();window.scrollTo(0,0);}else results();}
function results(){if(pics.some(x=>x===null)){n=pics.findIndex(x=>x===null);render();return;}$('summary').textContent='Here are the pictures each person chose. Compare choices in the family chat.';$('rows').replaceChildren();qs.forEach((q,i)=>{let r=document.createElement('div');r.className='row';let b=document.createElement('b');b.textContent=(i+1)+'. '+q[0];let p=document.createElement('p');p.textContent='Chose: '+q[2][pics[i]][0];r.append(b,p);$('rows').append(r);});$('output').value='FAMILY ROAD TRIP SCORECARD\n'+qs.map((q,i)=>(i+1)+'. '+q[0]+': '+q[2][pics[i]][0]).join('\n');$('quiz').classList.add('hidden');$('results').classList.remove('hidden');window.scrollTo(0,0);}
$('prev').onclick=()=>{if(n>0){n--;render();window.scrollTo(0,0);}};$('next').onclick=()=>{if(n<6){n++;render();window.scrollTo(0,0);}else results();};$('edit').onclick=()=>{n=0;render();};$('copy').onclick=async()=>{try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText($('output').value);else{ $('output').select();if(!document.execCommand('copy'))throw Error();}$('status').textContent='Copied. Paste it into your family chat.';}catch(e){$('output').select();$('status').textContent='Select the text above and tap Copy.';}};render();})();
</script></body></html>
